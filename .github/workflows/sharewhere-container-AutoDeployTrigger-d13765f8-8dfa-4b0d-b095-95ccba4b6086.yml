name: Trigger auto deployment for sharewhere-container

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/sharewhere-container-AutoDeployTrigger-d13765f8-8dfa-4b0d-b095-95ccba4b6086.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.SHAREWHERECONTAINER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SHAREWHERECONTAINER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SHAREWHERECONTAINER_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: docker.io
          registryUsername: ${{ secrets.SHAREWHERECONTAINER_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.SHAREWHERECONTAINER_REGISTRY_PASSWORD }}
          containerAppName: sharewhere-container
          resourceGroup: sharewhere-data
          imageToBuild: cole22simpson/sharewhere-container:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


