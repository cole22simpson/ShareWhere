name: Trigger auto deployment for sharewhere-container

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/sharewhere-container-AutoDeployTrigger-af8eb477-81c9-46fe-98a6-a6dcbb32ce47.yml'

  # Allow manual trigger 
  workflow_dispatch:
      
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.SHAREWHERECONTAINER_AZURE_CREDENTIALS }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: sharewhereregistry.azurecr.io
          registryUsername: ${{ secrets.SHAREWHERECONTAINER_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.SHAREWHERECONTAINER_REGISTRY_PASSWORD }}
          containerAppName: sharewhere-container
          resourceGroup: sharewhere-data
          imageToBuild: sharewhereregistry.azurecr.io/sharewhere-container:${{ github.sha }}
          
            

     

